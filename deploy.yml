# =============================================================================
# FraudShield — Azure Deployment Guide
# =============================================================================
#
# Resources deployed:
#   • Azure App Service (B2 tier) — .NET Core backend
#   • Azure Static Web Apps (Free tier) — React frontend
#   • Azure SQL Database (S2 tier) — SQL Server managed database
#   • Azure Application Insights — telemetry
# =============================================================================

name: Deploy FraudShield to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: fraudshield-api          # Change to your App Service name
  AZURE_STATICAPP_NAME: fraudshield-frontend  # Change to your Static Web App name
  DOTNET_VERSION: '8.0.x'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20.x'

jobs:
  # ── 1. Build & Test .NET Backend ──────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish
        run: dotnet publish --no-build --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./backend/publish

  # ── 2. Build React Frontend ───────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-app
          path: ./frontend/dist

  # ── 3. Build Python ML Service ────────────────────────────────────────────
  build-ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install and test
        run: |
          pip install -r requirements.txt
          python -c "from models.scorer import FraudScorer; s = FraudScorer(); print('ML service OK')"

  # ── 4. Deploy to Azure ────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-ml]
    environment: production

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./dotnet-app

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: react-app
          path: ./react-app

      # Deploy .NET backend to Azure App Service
      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./dotnet-app

      # Deploy React frontend to Azure Static Web Apps
      - name: Deploy frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./react-app
          skip_app_build: true
